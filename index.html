<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cargando...</title>
    <script type="text/javascript">
        // Detecta el día del mes actual del dispositivo del cliente
        var hoy = new Date().getDate();
        
        // Si es el día 1, 2 o 3, lo envía a la carpeta de aviso
        if (hoy === 1 || hoy === 2 || hoy === 3 || hoy === 6) {
            window.location.href = "./aviso/";
        } else {
            // El día 4 en adelante lo envía a la carpeta de corte
            window.location.href = "./corte/";
        }
    </script>
</head>
<body>
    <p style="text-align:center; font-family:Arial; margin-top:50px; color:#64748b;">
        Cargando portal de usuario, por favor espere...
    </p>
</body>
</html>
